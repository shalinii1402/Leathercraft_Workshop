<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Leathercraft Workshop</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body
    style="height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative;">

    <!-- Theme Toggle (Absolute Positioned) -->
    <button id="theme-toggle" class="theme-toggle"
        style="position: absolute; top: 1.5rem; right: 2rem; background: none; border: none; font-size: 1.5rem; color: var(--text-color); cursor: pointer; z-index: 1000;">
        <i class="fas fa-moon"></i>
    </button>

    <main style="width: 100%; display: flex; justify-content: center; padding: 1rem;">
        <div class="auth-wrapper" style="width: 100%; max-width: 450px;">
            <div class="auth-container"
                style="background: var(--card-bg); padding: 2.5rem; border-radius: 20px; box-shadow: var(--shadow); border: 1px solid var(--glass-border); text-align: center;">

                <!-- Logo moved inside card -->
                <div style="margin-bottom: 2rem;">
                    <a href="index.html" class="logo" style="font-size: 2rem;"><i class="fas fa-scroll"></i>
                        LEATHERCRAFT</a>
                </div>

                <div class="auth-header">
                    <h2>Welcome Back</h2>
                    <p>Enter your credentials to access your account</p>
                </div>

                <form class="contact-form" style="text-align: left;">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="john@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-input-wrapper" style="position: relative;">
                            <input type="password" id="password" placeholder="••••••••" required style="width: 100%;">
                            <i class="fas fa-eye toggle-password" id="togglePassword"
                                style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #999;"></i>
                        </div>
                    </div>

                    <div class="auth-options"
                        style="display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; margin-bottom: 1.5rem;">
                        <label>
                            <input type="checkbox"> Remember me
                        </label>
                        <a href="#" class="forgot-password" style="color: var(--accent);">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
                </form>

                <div class="social-login" style="margin-top: 2rem;">
                    <div class="social-divider"
                        style="display: flex; align-items: center; margin-bottom: 1.5rem; color: #888; font-size: 0.9rem;">
                        <span style="flex: 1; height: 1px; background: #ddd;"></span>
                        <span style="padding: 0 10px;">Or login with</span>
                        <span style="flex: 1; height: 1px; background: #ddd;"></span>
                    </div>
                    <div class="social-btns" style="display: flex; gap: 1rem;">
                        <button class="social-btn google"
                            style="flex: 1; padding: 0.8rem; border: 1px solid #ddd; border-radius: 8px; background: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.3s;">
                            <i class="fab fa-google" style="color: #DB4437;"></i> Google
                        </button>
                        <button class="social-btn facebook"
                            style="flex: 1; padding: 0.8rem; border: 1px solid #ddd; border-radius: 8px; background: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.3s;">
                            <i class="fab fa-facebook-f" style="color: #4267B2;"></i> Facebook
                        </button>
                    </div>
                </div>

                <div class="auth-footer" style="margin-top: 2rem; font-size: 0.9rem;">
                    <p>Don't have an account? <a href="signup.html" style="color: var(--accent); font-weight: 600;">Sign
                            up</a></p>
                </div>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
</body>

</html>
