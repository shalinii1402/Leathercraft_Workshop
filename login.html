<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Leathercraft Workshop</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg?v=5">
    <link rel="shortcut icon" href="assets/images/favicon.svg?v=5">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css?v=5">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="auth-body">


    <div class="auth-wrapper">
        <div class="auth-card">
            <!-- Logo -->
            <a href="index.html" class="auth-logo">
                <i class="fas fa-scroll"></i>
                <span>LEATHERCRAFT</span>
            </a>

            <!-- Header -->
            <div class="auth-header">
                <h2>Welcome Back</h2>
                <p>Sign in to continue your crafting journey</p>
            </div>

            <!-- Form -->
            <form class="auth-form">
                <div class="auth-group">
                    <label for="email">Email Address</label>
                    <div class="auth-input-wrapper">
                        <input type="email" id="email" class="auth-input" placeholder="name@company.com" required>
                    </div>
                </div>

                <div class="auth-group">
                    <label for="password">Password</label>
                    <div class="auth-input-wrapper">
                        <input type="password" id="password" class="auth-input" placeholder="••••••••" required>
                        <i class="fas fa-eye auth-input-icon toggle-password"></i>
                    </div>
                </div>

                <div class="auth-options">
                    <label class="auth-remember">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" class="auth-forgot">Forgot password?</a>
                </div>

                <button type="submit" class="auth-btn">Sign In</button>
            </form>

            <!-- Social Login (Original Style) -->
            <div class="social-login">
                <div class="social-divider">
                    <span></span>
                    <span>Or continue with</span>
                    <span></span>
                </div>
                <div class="social-container">
                    <a href="https://google.com" class="social-btn" title="Google">
                        <i class="fab fa-google" style="color: #DB4437;"></i>
                    </a>
                    <a href="https://apple.com" class="social-btn" title="Apple">
                        <i class="fab fa-apple" style="color: #000;"></i>
                    </a>
                    <a href="https://facebook.com" class="social-btn" title="Facebook">
                        <i class="fab fa-facebook-f" style="color: #4267B2;"></i>
                    </a>
                </div>
            </div>

            <!-- Footer -->
            <div class="auth-footer">
                <p>Don't have an account? <a href="signup.html">Create one for free</a></p>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>

</html>
