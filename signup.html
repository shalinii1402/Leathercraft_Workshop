<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Leathercraft Workshop</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg?v=4">
    <link rel="shortcut icon" href="assets/images/favicon.svg?v=4">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Specific overrides for a compact, minimal signup page */
        body {
            background-color: var(--bg-light);
            /* Off-white background */
        }

        .form-group {
            margin-bottom: 1rem;
            /* Compact vertical spacing */
        }

        .form-group label {
            font-size: 0.85rem;
            margin-bottom: 0.35rem;
            display: block;
            text-align: left;
            font-weight: 500;
        }

        .form-group input {
            padding: 0.75rem 1rem;
            /* Compact input padding */
            font-size: 0.95rem;
            border-radius: 8px;
            /* Rounded corners */
        }

        .btn-primary {
            padding: 0.9rem;
            /* Full width button */
            border-radius: 8px;
            /* Rounded corners */
            font-size: 1rem;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(212, 163, 115, 0.4);
        }

        .social-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            /* Circle icons */
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #eee;
            background: #fff;
            transition: all 0.2s;
            font-size: 1.1rem;
            cursor: pointer;
        }

        .social-btn:hover {
            background: #f9f9f9;
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .social-container {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
        }

        /* Checkbox alignment */
        .auth-options {
            text-align: left;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
        }

        .auth-options label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: #555;
        }

        .auth-options input[type="checkbox"] {
            width: auto;
            margin: 0;
            accent-color: var(--accent);
        }
    </style>
</head>

<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative;">

    <!-- Theme Toggle -->
    <button id="theme-toggle" class="theme-toggle"
        style="position: absolute; top: 2rem; right: 2rem; background: none; border: none; font-size: 1.2rem; color: var(--text-color); cursor: pointer; z-index: 1000; opacity: 0.7; transition: opacity 0.3s;">
        <i class="fas fa-moon"></i>
    </button>

    <main style="width: 100%; display: flex; justify-content: center; align-items: center; padding: 2rem 1rem;">
        <div class="auth-wrapper" style="width: 100%; max-width: 420px;">
            <div class="auth-container"
                style="background: var(--card-bg); padding: 2.5rem 2rem; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); border: 1px solid rgba(0,0,0,0.03); text-align: center;">

                <!-- Logo -->
                <div style="margin-bottom: 1.5rem;">
                    <a href="index.html" class="logo"
                        style="font-size: 1.5rem; display: inline-flex; align-items: center; justify-content: center; color: var(--accent);"><i
                            class="fas fa-scroll" style="margin-right: 8px;"></i> LEATHERCRAFT</a>
                </div>

                <!-- Header -->
                <div class="auth-header" style="margin-bottom: 1.8rem;">
                    <h2 style="font-size: 1.8rem; margin-bottom: 0.3rem; color: var(--primary);">Get Started</h2>
                    <p style="font-size: 0.9rem; color: #666; font-weight: 300;">Create your account now</p>
                </div>

                <!-- Form -->
                <form class="contact-form" style="display: flex; flex-direction: column; gap: 0; width: 100%;">

                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" placeholder="John Doe" required style="width: 100%;">
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="john@example.com" required style="width: 100%;">
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-input-wrapper" style="position: relative;">
                            <input type="password" id="password" placeholder="••••••••" required style="width: 100%;">
                            <i class="fas fa-eye toggle-password" id="togglePassword"
                                style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #bbb; font-size: 0.9rem;"></i>
                        </div>
                    </div>

                    <div class="auth-options">
                        <label>
                            <input type="checkbox" required> I agree to the <a href="#"
                                style="color: var(--accent); text-decoration: none; font-weight: 500;">Terms &
                                Conditions</a>
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account</button>
                </form>

                <!-- Social Divider -->
                <div class="social-login" style="margin-top: 1.8rem; margin-bottom: 1.5rem;">
                    <div class="social-divider"
                        style="display: flex; align-items: center; color: #999; font-size: 0.8rem; margin-bottom: 1.2rem;">
                        <span style="flex: 1; height: 1px; background: #eee;"></span>
                        <span
                            style="padding: 0 10px; font-weight: 400; text-transform: uppercase; letter-spacing: 0.5px; font-size: 0.7rem;">Or
                            continue with</span>
                        <span style="flex: 1; height: 1px; background: #eee;"></span>
                    </div>

                    <!-- Social Icons (Compact) -->
                    <div class="social-container">
                        <div class="social-btn" title="Google">
                            <i class="fab fa-google" style="color: #DB4437;"></i>
                        </div>
                        <div class="social-btn" title="Facebook">
                            <i class="fab fa-facebook-f" style="color: #4267B2;"></i>
                        </div>
                    </div>
                </div>

                <!-- Footer -->
                <div class="auth-footer" style="font-size: 0.85rem; color: #666;">
                    <p>Already have an account? <a href="login.html"
                            style="color: var(--primary); font-weight: 600;">Log in</a></p>
                </div>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
</body>

</html>
